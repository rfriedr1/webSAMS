[project]
name = "sams-web"
version = "0.1.0"
description = "Python web migration of the SAMS Delphi LIMS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  # Starlette 1.0 changed TemplateResponse(name, ctx) to
  # TemplateResponse(request, name, ctx) — a hard breaking change for our
  # ~27 call sites. Pin below 1.0 until the call sites are migrated.
  "starlette>=0.46,<1.0",
  "uvicorn[standard]>=0.31.0",
  "sqlalchemy>=2.0.35",
  "pymysql>=1.1.1",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.28.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
